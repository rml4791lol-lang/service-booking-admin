# 项目配置
like:
  upload-directory: /www/uploads/likeadmin-java/ # 上传目录
  # Swagger 配置（#54）：SwaggerConfig 用 @Value 直接注入这两个键且无默认值，
  # 新环境缺省会启动失败（Could not resolve placeholder 'like.swagger.enabled'）。
  # 本地默认关闭文档，需要时改 enabled=true。
  swagger:
    enabled: false
    pathMapping: ""
  # 微信小程序登录（#23）：真实模式读取 la_config.mnp_setting 的 app_id/app_secret。
  # 本地没有可用凭据时把 mock-enabled 设为 true；mock-openid 留空时按 code 生成稳定 openid。
  wechat:
    login:
      mock-enabled: false
      mock-openid: ""
      # 本地 mock 专用：保留 code -> 微信 errcode 映射，用来验无效 code/错误码分支。
      # 格式 "code:errcode,code:errcode"，只允许保留 code；生产不配置。
      mock-error-codes: ""
      # 可选：覆盖 la_config 中的 app_id/app_secret；留空则读数据库。
      app-id: ""
      app-secret: ""
  # 调试开关（GlobalConfig.debug）：缺省 false；生产必须保持 false，本地排查可设为 true。
  # 该开关只影响本地调试行为，异常响应始终已脱敏。
  debug: true
  # 次数券购买（#24）：本地没有微信商户凭据时打开 mock 网关，
  # POST /api/pay/mock/notify 支持 success/fail/cancel/duplicate；
  # 旧入口 /api/coupon/mockNotify 兼容。生产必须 false。
  pay:
    mock-callback-enabled: false
  # 订阅消息：模板 ID 必须与小程序 release 配置一致；留空时任务跳过并告警。
  subscribe:
    lesson-reminder-template-id: ""
    lesson-cancel-template-id: ""
    page: pages/records/index
  # 测试通知接口仅用于隔离联调，默认关闭；即使开启也必须登录且只能给自己发送。
  test-notify:
    enabled: false
  # 日志脱敏（T30.11）：默认全开；本地排障可关闭，生产必须保持 true。
  log:
    mask-openid: true
    mask-mobile: true
    mask-amount: true
  # 账号安全（#70）：绑定/改绑手机号必须短信验证（BDSJHM/BGSJHM 场景）。
  # 本地短信通道未接入或联调 mock 时可临时置 false；生产必须 true。
  user:
    bind-mobile:
      require-sms-code: true

# 支付宝支付回调地址（#54）：PayServiceImpl 用 @Value 直接注入 ali.pay.order-notify-url，
# 缺省会启动失败；本地没有支付宝凭据也不会触发该回调，保留默认路径即可。
ali:
  pay:
    order-notify-url: /api/pay/ali/notify/order

# 框架配置
spring:
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/【库名称】?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false
    type: com.zaxxer.hikari.HikariDataSource # 数据源类型
    driver-class-name: com.mysql.jdbc.Driver # MySql的驱动
    username: root # 数据库账号
    password: root # 数据库密码
  # Redis配置
  redis:
    host: localhost   # Redis服务地址
    port: 6379        # Redis端口
    password:         # Redis密码
    database: 0       # 数据库索引

# Mybatis-plus配置 【是否开启SQL日志输出】
