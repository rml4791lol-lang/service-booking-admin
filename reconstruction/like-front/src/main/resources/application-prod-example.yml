# 生产安全基线示例
#
# 文件名中的 prod-example 不是 Spring profile，不会自动加载，避免误用。
# 部署时请把需要的项合并到部署目录的 config/application.yml（或容器挂载的配置）。
# 完整生产配置以 T30.10 的 deploy/config/*.template 为准。

like:
  # 生产必须关闭调试；代码缺省也是 false，这里显式声明便于审计。
  debug: false
  # Swagger 文档生产必须关闭（#149）：SwaggerConfig 默认 disabled Docket，/v3/api-docs 404；
  # 显式写键便于审计，也防止打包进 jar 的 application.yml 带了 true 时无覆盖。
  swagger:
    enabled: false
    pathMapping: ""
  # 微信登录/支付 mock 只用于本地/测试；生产必须关闭。
  wechat:
    login:
      mock-enabled: false
  pay:
    mock-callback-enabled: false
  # 课前提醒/取消通知模板由甲方申请后注入；生产不得沿用历史主体模板 ID。
  subscribe:
    lesson-reminder-template-id: ""
    lesson-cancel-template-id: ""
    page: pages/records/index
  # 测试通知接口生产必须关闭；prod profile 下误开会导致启动失败。
  test-notify:
    enabled: false
  # 日志脱敏：生产必须全部 true。
  log:
    mask-openid: true
    mask-mobile: true
    mask-amount: true
  # 账号安全（#70）：绑定/改绑手机号必须短信验证，生产不得关闭。
  user:
    bind-mobile:
      require-sms-code: true

spring:
  devtools:
    restart:
      enabled: false
